<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Hotline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2230"/>
      <stop offset="1" stop-color="#0c0e15"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.45" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#e2261b"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8d0e0"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="50.5" fill="none" stroke="#ff7a1a" stroke-opacity="0.45" stroke-width="3"/>

  <!-- Flame, behind the receiver so the receiver looks like it's on fire -->
  <g transform="translate(150 98)">
    <path fill="url(#flame)" d="M0 -66 C 30 -34 50 -10 40 20 C 32 44 -32 44 -40 20 C -46 2 -34 -16 -18 -32 C -16 -14 -8 -6 2 -4 C 10 -26 8 -46 0 -66 Z"/>
    <path fill="#ffe7a0" d="M2 -6 C 16 6 22 18 16 30 C 10 40 -10 40 -16 30 C -20 22 -14 10 -4 2 C -2 10 2 14 6 14 C 8 8 6 0 2 -6 Z" opacity="0.95"/>
  </g>

  <!-- Classic phone receiver: a handle with an earpiece and a mouthpiece -->
  <g transform="translate(118 158) rotate(-28)">
    <rect x="-74" y="-16" width="148" height="30" rx="15" fill="url(#phone)"/>
    <path fill="url(#phone)" d="M-90 -6 h48 a8 8 0 0 1 8 8 v14 c0 14 -10 24 -24 24 h-16 c-14 0 -24 -10 -24 -24 v-14 a8 8 0 0 1 8 -8 z"/>
    <path fill="url(#phone)" d="M42 -6 h48 a8 8 0 0 1 8 8 v14 c0 14 -10 24 -24 24 h-16 c-14 0 -24 -10 -24 -24 v-14 a8 8 0 0 1 8 -8 z"/>
    <rect x="-74" y="-16" width="148" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
